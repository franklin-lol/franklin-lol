name: Metrics

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          template: classic
          base: "header, activity"
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_achievements: yes
          plugin_achievements_display: compact
          config_timezone: Europe/Moscow
          config_display: large
          extras_css: |
            svg { color: #999999 !important; }
            h1, h2, h3 { color: #CCCCCC !important; }
            .field svg { fill: #666666 !important; }
            :root {
              --color-calendar-graph-day-bg: #1a1a1a !important;
              --color-calendar-graph-day-border: rgba(255,255,255,0.06) !important;
              --color-calendar-graph-day-L1-bg: #333333 !important;
              --color-calendar-graph-day-L2-bg: #555555 !important;
              --color-calendar-graph-day-L3-bg: #888888 !important;
              --color-calendar-graph-day-L4-bg: #cccccc !important;
            }